name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python syntax
        run: python -m py_compile examples/python/*.py
      - name: Node syntax
        run: node --check examples/node/chat-stream.mjs
      - name: Shell syntax
        run: for f in examples/curl/*.sh; do sh -n "$f"; done
      - name: Tidak ada API key asli di repo
        run: |
          if grep -rEn "pt-store-[A-Za-z0-9]{16,}" --exclude-dir=.git .; then
            echo "Ditemukan API key asli"; exit 1
          fi
